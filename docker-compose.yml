services:
  claude-web:
    build:
      context: .
    image: claude-code-web:local
    container_name: claude-code-web
    restart: unless-stopped
    environment:
      # ---- third-party API: OpenRouter's Anthropic-compatible endpoint ----
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://openrouter.ai/api}"
      # OpenRouter authenticates with a bearer token, which Claude Code sends
      # via ANTHROPIC_AUTH_TOKEN.
      ANTHROPIC_AUTH_TOKEN: "${OPENROUTER_API_KEY}"
      # MUST stay an empty string, otherwise Claude Code may fall back to
      # authenticating against Anthropic directly.
      ANTHROPIC_API_KEY: ""
      # Optional: lets the /model picker discover the gateway's models.
      CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY: "1"
      # Optional model pins (OpenRouter "vendor/model" ids). Blank = Claude Code defaults.
      ANTHROPIC_DEFAULT_OPUS_MODEL: "${ANTHROPIC_DEFAULT_OPUS_MODEL:-}"
      ANTHROPIC_DEFAULT_SONNET_MODEL: "${ANTHROPIC_DEFAULT_SONNET_MODEL:-}"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: "${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}"
      # ---- web UI ----
      HOST: "0.0.0.0"
      PORT: "3001"
      SERVER_PORT: "3001"
      WORKSPACES_ROOT: "/home/agent/workspace"
      DATABASE_PATH: "/home/agent/.cloudcli/auth.db"
    volumes:
      # Claude Code config + CloudCLI auth/state (persist across restarts)
      - ./data/claude:/home/agent/.claude
      - ./data/cloudcli:/home/agent/.cloudcli
      # installed CloudCLI plugins (persist across rebuilds)
      - ./data/cloudcli-ui:/home/agent/.claude-code-ui
      # Your projects live here; the agent reads and writes them.
      - "${WORKSPACE_DIR:-./workspace}:/home/agent/workspace"
    expose:
      - "3001"
    # Reach the UI directly for debugging (bypasses Caddy). Commented by default.
    # ports:
    #   - "127.0.0.1:3001:3001"

  # Browser page (at /admin) to switch provider + API key. Writes Claude Code's
  # settings.json, which new sessions pick up automatically - no restart needed.
  key-manager:
    build: ./keymanager
    image: claude-code-keymgr:local
    container_name: claude-code-keymgr
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "/app/app.py"]
    working_dir: /app
    environment:
      KEYMGR_DATA_DIR: "/data"
      KEYMGR_PORT: "8000"
      # Optional: set ADMIN_PASSWORD in .env to protect /admin with a password.
      KEYMGR_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - ./keymanager/app.py:/app/app.py:ro
      # same host dir that claude-web mounts as ~/.claude
      - ./data/claude:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    container_name: claude-code-caddy
    restart: unless-stopped
    depends_on:
      - claude-web
      - key-manager
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # Generated by install.sh (holds the HTTPS site address + basic-auth hash).
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
